{% extends "base.html" %}
{% block content %}
<section x-data="{ creating: false, suggestingMood: false, mood: '' }">
  <hgroup>
    <h1>Novo vídeo</h1>
    <p>Crie um run de vídeo musical. Cada etapa roda separada, com progresso ao vivo.</p>
  </hgroup>

  <form @submit.prevent="
      creating = true;
      const fd = new FormData($el);
      const r = await fetch('/api/runs', { method: 'POST', body: fd });
      const j = await r.json();
      window.location.href = '/runs/' + j.run_id;
    ">
    <div class="grid">
      <label>Personagem
        <input name="character" placeholder="Sung Jinwoo" required x-ref="character">
      </label>
      <label>Anime
        <input name="anime" placeholder="Solo Leveling" x-ref="anime">
      </label>
    </div>
    <div class="grid">
      <label>Mood / vibe <small class="muted">(opcional — deixe vazio para a IA inferir)</small>
        <div class="input-with-btn">
          <input name="mood" placeholder="dark cold shadow army, ominous power" x-model="mood">
          <button type="button" class="secondary outline"
                  :aria-busy="suggestingMood" :disabled="suggestingMood"
                  @click="
                    const character = $refs.character.value.trim();
                    if (!character) { alert('Informe o personagem primeiro.'); return; }
                    suggestingMood = true;
                    try {
                      const r = await fetch('/api/suggest-mood', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ character, anime: $refs.anime.value.trim() }),
                      });
                      const j = await r.json();
                      if (j.mood) mood = j.mood;
                    } finally { suggestingMood = false; }
                  ">Sugerir</button>
        </div>
      </label>
      <label>Idioma
        <select name="language">
          <option value="en">English</option>
          <option value="pt">Português</option>
          <option value="es">Español</option>
        </select>
      </label>
    </div>
    <label>Canal
      <select name="channel_slug">
        {% for ch in channels %}
        <option value="{{ ch.slug }}">{{ ch.name }}</option>
        {% endfor %}
      </select>
    </label>
    <button type="submit" :aria-busy="creating" :disabled="creating">Criar run</button>
  </form>
</section>

<section x-data='{ runs: {{ runs | tojson }} }'>
  <h2>Runs recentes</h2>
  <template x-if="runs.length">
    <div class="runs-list">
      <template x-for="run in runs" :key="run.run_id">
        <div class="run-card">
          <a :href="'/runs/' + run.run_id" class="run-card-link">
            <div class="run-ring"
                 :class="run.total_steps && run.done_count >= run.total_steps ? 'is-complete' : ''"
                 :style="`--pct: ${run.total_steps ? Math.round(run.done_count / run.total_steps * 100) : 0}`">
              <span x-text="(run.total_steps && run.done_count >= run.total_steps) ? '✓' : (run.done_count || 0) + '/' + (run.total_steps || 8)"></span>
            </div>
            <div class="run-card-main">
              <strong x-text="(run.character || run.run_id) + (run.anime ? ' · ' + run.anime : '')"></strong>
              <template x-if="run.title">
                <span class="run-title" x-text="run.title"></span>
              </template>
            </div>
          </a>
          <div class="run-card-meta">
            <template x-if="run.created_at">
              <span class="run-date" x-text="run.created_at"></span>
            </template>
            <span class="run-lang" x-text="run.language"></span>
          </div>
          <button class="run-delete" title="Deletar run"
                  @click="
                    if (!confirm('Deletar este run e todos os seus arquivos? Isso não pode ser desfeito.')) return;
                    await fetch('/api/runs/' + run.run_id, { method: 'DELETE' });
                    runs = runs.filter(r => r.run_id !== run.run_id);
                  ">🗑</button>
        </div>
      </template>
    </div>
  </template>
  <template x-if="!runs.length">
    <div class="empty-state">
      <span class="empty-icon">🎬</span>
      <p>Nenhum vídeo criado ainda. Comece pelo formulário acima ↑</p>
    </div>
  </template>
</section>
{% endblock %}
