[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cutforge"
version = "0.1.0"
description = "Anime music-video generator — script/lyrics, footage, karaoke alignment and Premiere-ready project export."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Matheus Moraes" }]

dependencies = [
    # AI content generation
    "anthropic>=0.39.0",
    "openai>=1.30.0",
    "elevenlabs>=1.0.0",
    # Footage download
    "yt-dlp>=2025.05.22",
    "bgutil-ytdlp-pot-provider>=1.3.1",
    # Editable timeline export (Premiere reads FCP7 XML)
    "opentimelineio>=0.15.0",
    "otio-fcp-adapter>=1.0.0",
    # Config / models
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    # Media / images
    "mutagen>=1.47.0",
    "Pillow>=10.0.0",
    # Reference rhythm analysis (BPM/beat extraction from a reference rap)
    "librosa>=0.10.2",
    "soundfile>=0.12.0",
    # Karaoke alignment + reference transcription (local Whisper force-align/transcribe)
    "stable-ts>=2.17.0",
    # Vocal isolation before force-alignment (strips the beat so onsets lock to vocals)
    "demucs>=4.0.0",
    # Desktop UI (FastAPI + pywebview)
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0.0",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
cutforge = "cutforge.ui.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cutforge = ["ui/templates/**/*", "ui/static/**/*", "assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
